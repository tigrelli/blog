<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글 목록 | 블로그 | 정태희</title>
<meta name="description" content="정태희 블로그의 전체 글 목록입니다. 카테고리별로 필터링하거나 검색할 수 있습니다.">
<meta property="og:title" content="글 목록 | 블로그 | 정태희">
<meta property="og:description" content="정태희 블로그의 전체 글 목록입니다. 카테고리별로 필터링하거나 검색할 수 있습니다.">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/images/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon/favicon-48x48.png">
<link rel="apple-touch-icon" href="/assets/images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="blog-theme">
<div id="site-header"></div>

<main>
  <section class="section blog-top">
    <div class="container">
      <p class="eyebrow">BLOG</p>
      <h1 class="page-title">글 목록</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <ul class="filter-row" id="category-filter" role="tablist" aria-label="블로그 카테고리 필터"></ul>

      <div class="blog-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="search-input" placeholder="글 제목 또는 내용으로 검색...">
      </div>

      <div class="post-grid" id="post-grid"></div>
      <p class="blog-empty" id="empty-state" style="display:none;">검색 결과가 없습니다.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/assets/js/blog-layout.js" defer></script>
<script src="/assets/js/blog-posts.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const categories = await fetchCategories();
  const posts = await fetchPosts();

  const filterRow = document.getElementById("category-filter");
  filterRow.innerHTML = categories
    .map((cat, i) => {
      const filter = cat === "전체" ? "all" : cat;
      return `<li><button type="button" class="filter-chip${i === 0 ? " active" : ""}" data-filter="${escapeHtml(filter)}">${escapeHtml(cat)}</button></li>`;
    })
    .join("");

  const grid = document.getElementById("post-grid");
  grid.innerHTML = posts.map(renderPostCard).join("");

  const chips = document.querySelectorAll(".filter-chip");
  const cards = document.querySelectorAll(".post-card");
  const searchInput = document.getElementById("search-input");
  const emptyState = document.getElementById("empty-state");
  let activeCategory = "all";

  function applyFilters() {
    const query = searchInput.value.trim().toLowerCase();
    let visibleCount = 0;
    cards.forEach((card) => {
      const matchesCategory = activeCategory === "all" || card.dataset.category === activeCategory;
      const matchesSearch = !query || card.textContent.toLowerCase().includes(query);
      const show = matchesCategory && matchesSearch;
      card.style.display = show ? "" : "none";
      if (show) visibleCount += 1;
    });
    emptyState.style.display = visibleCount === 0 ? "" : "none";
  }

  chips.forEach((chip) => {
    chip.addEventListener("click", () => {
      chips.forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      activeCategory = chip.dataset.filter;
      applyFilters();
    });
  });

  searchInput.addEventListener("input", applyFilters);

  const initialCategory = new URLSearchParams(location.search).get("category");
  if (initialCategory) {
    const matchingChip = [...chips].find((c) => c.dataset.filter === initialCategory);
    if (matchingChip) {
      chips.forEach((c) => c.classList.remove("active"));
      matchingChip.classList.add("active");
      activeCategory = initialCategory;
    }
  }

  applyFilters();
});
</script>
</body>
</html>
