<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 | 정태희</title>
<meta name="description" content="AI, 개발일지, 소소한 일상까지 정태희가 기록하는 개인 블로그입니다.">
<meta property="og:title" content="블로그 | 정태희">
<meta property="og:description" content="AI, 개발일지, 소소한 일상까지 정태희가 기록하는 개인 블로그입니다.">
<meta property="og:type" content="website">
<link rel="icon" href="/assets/images/favicon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon/favicon-48x48.png">
<link rel="apple-touch-icon" href="/assets/images/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="blog-theme">
<div id="site-header"></div>

<main>
  <section class="section blog-top">
    <div class="container">
      <p class="eyebrow">BLOG</p>
      <h1 class="page-title">AI &amp; 개발 이야기, 그리고 이것저것</h1>
      <p class="about-lead">생성형 AI로 일하고 만드는 이야기, 개발일지, 그 밖의 이런저런 기록을 남깁니다. 포트폴리오 사이트와는 별도로 운영되는 공간입니다.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="section-heading">카테고리</h2>
      <ul class="blog-category-row" id="home-category-row"></ul>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <h2 class="section-heading" style="margin-bottom:0;">최신 글</h2>
        <a href="/blog/list.html" class="portfolio-link">전체보기 →</a>
      </div>
      <div class="post-grid" id="latest-posts"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/assets/js/blog-layout.js" defer></script>
<script src="/assets/js/blog-posts.js" defer></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const categories = await fetchCategories();
  const categoryRow = document.getElementById("home-category-row");
  categoryRow.innerHTML = categories
    .filter((cat) => cat !== "전체")
    .map((cat) => `<li><a class="chip" href="/blog/list.html?category=${encodeURIComponent(cat)}">${escapeHtml(cat)}</a></li>`)
    .join("");

  const posts = await fetchPosts();
  const latest = document.getElementById("latest-posts");
  latest.innerHTML = posts.length
    ? posts.slice(0, 4).map(renderPostCard).join("")
    : '<p class="blog-empty">아직 발행된 글이 없습니다.</p>';
});
</script>
</body>
</html>
